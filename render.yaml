services:
  - type: web
    name: fitloyalty-backend
    env: node
    # pnpm con la version exacta de "packageManager"; npx lo usa sin instalarlo
    # global. puppeteer descarga Chrome para WhatsApp igual que con npm
    # (allowBuilds en backend/pnpm-workspace.yaml).
    buildCommand: cd backend && npx --yes pnpm@12.15.0 install --frozen-lockfile --prod
    # Lo mismo que `pnpm start`, sin necesitar pnpm al arrancar.
    startCommand: cd backend && node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: fitloyalty-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: TRIAL_DAYS
        value: 14
      - key: DEV_EMAILS
        value: dev@fitloyalty.local,staging@fitloyalty.local
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        value: FitLoyalty <santicosalamanca@gmail.com>
      - key: FRONTEND_URL
        value: https://fitloyalty-zeta.vercel.app
      - key: SUPPORT_EMAIL
        value: fitloyaltysaas@gmail.com