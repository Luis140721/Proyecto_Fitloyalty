name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rama:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar nombre de la rama
        env:
          RAMA: ${{ github.head_ref }}
        run: |
          if [[ "$RAMA" =~ ^(feat|feature|fix|docs|chore)/[a-z0-9][a-z0-9._/-]*$ || "$RAMA" =~ ^(dependabot/|revert-) || "$RAMA" == "develop" ]]; then
            echo "Nombre de rama válido: $RAMA"
          else
            echo "::error::La rama '$RAMA' no sigue la convención: feat/…, fix/…, docs/… o chore/… en minúsculas (o develop para una release). Ver CONTRIBUTING.md"
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Comprobar sintaxis de src/
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      # Las pruebas simulan la base de datos y los envios (WhatsApp, correo): no
      # necesitan servicios ni secretos. RQNF-07. `npm test` mide la cobertura y
      # falla si baja del coverageThreshold de jest.config.js.
      - name: Pruebas con cobertura y umbral
        run: npm test
      # El reporte de cobertura queda descargable desde la pestaña Actions.
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: coverage-backend
          path: backend/coverage/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Antes del build: si la cobertura baja de los thresholds de vite.config.js,
      # el job falla sin gastar tiempo en compilar.
      - name: Pruebas con cobertura y umbral
        run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: coverage-frontend
          path: frontend/coverage/
          retention-days: 7

  # No construye ni prueba nada: deja en el resumen del run quién hizo commits
  # de pruebas desde el lunes (evidencia individual del bootcamp).
  evidencia-individual:
    runs-on: ubuntu-latest
    steps:
      # --since necesita el historial completo; el checkout por defecto trae un solo commit.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Commits de pruebas por autor esta semana
        run: |
          autores="$(git shortlog -sn --since="last Monday" HEAD -- \
            'backend/tests/*' 'frontend/tests/*' 'e2e/*' 'fitloyalty_cliente/test/*' '*.test.*' '*.spec.*')"
          {
            echo "### Commits de pruebas por autor desde el lunes"
            echo
            echo '```'
            echo "${autores:-Sin commits de pruebas desde el lunes.}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
