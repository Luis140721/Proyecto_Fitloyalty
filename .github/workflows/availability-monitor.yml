name: Monitor de disponibilidad API

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  comprobar-api:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Comprobar endpoint de salud
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          status_code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --max-time 30 \
            'https://fitloyalty-api.onrender.com/api/healthz')"

          if [ "$status_code" != "200" ]; then
            echo "::error::La API respondió HTTP $status_code"
            cat "$response_file"
            exit 1
          fi

          if ! grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' "$response_file"; then
            echo "::error::La respuesta no contiene status=ok"
            cat "$response_file"
            exit 1
          fi

          echo "Disponibilidad API OK: HTTP $status_code y status=ok"
