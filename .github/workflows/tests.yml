# Las pruebas del proyecto: el workflow tests.yml de la semana 2 del bootcamp,
# ampliado en la semana 8 con la integracion (PostgreSQL como servicio) y los
# E2E. Los nombres de los jobs son los checks obligatorios de main: backend y
# frontend, y despues integracion y e2e. No los cambies sin cambiar la proteccion.
name: tests

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v7.0.1
      # Instala la version de pnpm que fija "packageManager" en backend/package.json.
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: backend/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Comprobar sintaxis de src/
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      # T6, item 14: el linter no puede tener errores (los avisos no fallan).
      - name: Linter (ESLint)
        run: pnpm lint
      # Las pruebas simulan la base de datos y los envios (WhatsApp, correo): no
      # necesitan servicios ni secretos. RQNF-07. `pnpm test` mide la cobertura y
      # falla si baja del coverageThreshold de jest.config.js.
      - name: Pruebas con cobertura y umbral
        run: pnpm test
      # El reporte de cobertura queda descargable desde la pestaña Actions.
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: coverage-backend
          path: backend/coverage/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # T6, item 14: el linter no puede tener errores (los avisos no fallan).
      - name: Linter (ESLint)
        run: pnpm lint
      # Antes del build: si la cobertura baja de los thresholds de vite.config.js,
      # el job falla sin gastar tiempo en compilar.
      - name: Pruebas con cobertura y umbral
        run: pnpm test
      # Semana 8 (Front, Santiago): el resumen de cobertura queda en la pagina
      # del run, sin descargar el artefacto. Lee coverage/coverage-summary.json
      # (reporter json-summary de vite.config.js). Corre aunque falle el umbral,
      # que es justo cuando interesa ver cuanto falto.
      - name: Resumen de cobertura
        if: always()
        run: |
          node <<'JS'
          const fs = require('fs');
          const archivo = 'coverage/coverage-summary.json';
          if (!fs.existsSync(archivo)) {
            console.log('::warning::No hay coverage/coverage-summary.json: las pruebas no llegaron a medir.');
            process.exit(0);
          }
          const { total } = JSON.parse(fs.readFileSync(archivo, 'utf8'));
          const fila = (nombre, clave) => `| ${nombre} | ${total[clave].pct} % | ${total[clave].covered} de ${total[clave].total} |`;
          const tabla = [
            '### Cobertura del frontend',
            '',
            '| Métrica | Cobertura | Cubiertas |',
            '|---|---|---|',
            fila('Líneas', 'lines'),
            fila('Ramas', 'branches'),
            fila('Funciones', 'functions'),
            fila('Sentencias', 'statements'),
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${tabla}\n`);
          console.log(tabla);
          JS
      - run: pnpm run build
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: coverage-frontend
          path: frontend/coverage/
          retention-days: 7

  # Los tests que el job backend salta por no tener BD, aqui contra PostgreSQL
  # de verdad. El servicio es el db-test de e2e/docker-compose.yml: misma imagen,
  # mismas credenciales de prueba y 127.0.0.1:5433, lo unico que acepta la
  # guardia de la BD de pruebas (e2e/guardia-bd.cjs).
  integracion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: fitloyalty_test
          POSTGRES_PASSWORD: fitloyalty_test
          POSTGRES_DB: fitloyalty_test
        ports:
          - "127.0.0.1:5433:5432"
        # GitHub espera a que el healthcheck pase antes del primer paso.
        options: >-
          --health-cmd "pg_isready -U fitloyalty_test -d fitloyalty_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      # La BD del servicio. Los tests solo la aceptan porque esta en el entorno
      # del proceso y tiene la forma exacta de la BD de pruebas local.
      DATABASE_URL: postgres://fitloyalty_test:fitloyalty_test@127.0.0.1:5433/fitloyalty_test
      DB_SSL: "false"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: backend/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Las mismas migraciones que aplica el backend al arrancar, antes de los
      # tests: una migracion rota falla aqui y no en el despliegue.
      - name: Migraciones
        run: node src/db/migrate.js
      - name: Pruebas de integracion
        run: pnpm run test:integracion --json --outputFile=integracion.json
      # Sin DATABASE_URL estos tests se saltan y el job quedaria en verde sin
      # probar nada: aqui un test saltado es un error.
      - name: Ningun test saltado
        if: always()
        run: |
          node <<'JS'
          const fs = require('fs');
          if (!fs.existsSync('integracion.json')) {
            console.log('::error::Jest no dejo integracion.json: las pruebas no llegaron a correr.');
            process.exit(1);
          }
          const r = require('./integracion.json');
          const saltados = r.numPendingTests + r.numTodoTests;
          const linea = `${r.numPassedTests} pasan, ${r.numFailedTests} fallan y ${saltados} saltados, de ${r.numTotalTests}`;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Integracion con la BD\n\n${linea}\n`);
          console.log(linea);
          if (r.numTotalTests === 0 || saltados > 0) {
            console.log('::error::Hay tests de integracion saltados o no hay ninguno: revisa DATABASE_URL.');
            process.exit(1);
          }
          JS

  # La app completa en un navegador, como en la receta de la semana 8: el
  # backend arranca en segundo plano (y migra al arrancar), curl espera a que
  # /api/health responda 200 y el webServer de playwright.config.js levanta el
  # frontend. En el CI Playwright reutiliza ese backend (reuseExistingServer).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: fitloyalty_test
          POSTGRES_PASSWORD: fitloyalty_test
          POSTGRES_DB: fitloyalty_test
        ports:
          - "127.0.0.1:5433:5432"
        options: >-
          --health-cmd "pg_isready -U fitloyalty_test -d fitloyalty_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      # La BD del servicio: la misma que playwright.config.js usa por defecto.
      DATABASE_URL: postgres://fitloyalty_test:fitloyalty_test@127.0.0.1:5433/fitloyalty_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - name: Dependencias de backend, frontend y e2e
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir e2e install --frozen-lockfile
      # Antes de arrancar el backend: la URL pasa por la misma guardia de los
      # tests de integracion y de playwright.config.js. Sin DATABASE_URL, vacia
      # o con otra forma, sale con codigo 1 y solo el mensaje (sin el valor).
      - name: La BD es la de pruebas
        run: node e2e/guardia-bd.cjs DATABASE_URL
      # Arranca el backend en segundo plano: sigue vivo en los pasos siguientes.
      # Son las variables del webServer del backend en playwright.config.js; si
      # cambias una alli, cambiala aqui.
      - name: Start backend
        working-directory: backend
        env:
          PORT: "3001"
          NODE_ENV: test
          DB_SSL: "false"
          JWT_SECRET: jwt-solo-para-e2e-no-es-secreto
          DISABLE_SCHEDULER: "true"
          ENABLE_WHATSAPP: "false"
          BREVO_API_KEY: ""
          RESEND_API_KEY: ""
          FRONTEND_URL: http://localhost:5173
        run: node src/index.js > api.log 2>&1 &
      # Los navegadores no se cachean: Playwright recomienda instalarlos en cada
      # corrida, porque restaurarlos tarda casi lo mismo.
      - name: Chromium
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium
      # Espera a que el API responda (maximo 60 s), sin sleeps fijos. /api/health
      # responde 503 mientras no hay BD y 200 cuando ya migro.
      - name: Wait for the API
        run: curl --silent --fail --retry 30 --retry-delay 2 --retry-all-errors http://localhost:3001/api/health
      # Ademas del list y el HTML, deja un JSON para contar.
      - name: Pruebas E2E
        working-directory: e2e
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: resultados-e2e.json
        run: pnpm test --reporter=list,html,json
      - name: Ningun test saltado ni inestable
        if: always()
        working-directory: e2e
        run: |
          node <<'JS'
          const fs = require('fs');
          if (!fs.existsSync('resultados-e2e.json')) {
            console.log('::error::Playwright no dejo resultados-e2e.json: la config o el webServer fallaron antes de los tests.');
            process.exit(1);
          }
          const { stats } = JSON.parse(fs.readFileSync('resultados-e2e.json', 'utf8'));
          const linea = `${stats.expected} pasan, ${stats.unexpected} fallan, ${stats.flaky} inestables y ${stats.skipped} saltados`;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### E2E\n\n${linea}\n`);
          console.log(linea);
          if (stats.expected + stats.unexpected + stats.flaky === 0 || stats.skipped > 0) {
            console.log('::error::Hay tests E2E saltados o no corrio ninguno.');
            process.exit(1);
          }
          // Con CI, la config de la semana 7 reintenta una vez: un test que pasa
          // en el reintento queda como flaky y Playwright no falla. La Parte 3
          // del reto pide ningun flaky sin investigar.
          if (stats.flaky > 0) {
            console.log('::error::Hay tests E2E inestables (pasaron en el reintento): investigalos con la traza del reporte.');
            process.exit(1);
          }
          JS
      # Si algo falla, el reporte HTML con las trazas y el log del backend quedan descargables.
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            backend/api.log
          retention-days: 7

  # No construye ni prueba nada: deja en el resumen del run quién hizo commits
  # de pruebas desde el lunes (evidencia individual del bootcamp).
  evidencia-individual:
    runs-on: ubuntu-latest
    steps:
      # --since necesita el historial completo; el checkout por defecto trae un solo commit.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Commits de pruebas por autor esta semana
        run: |
          autores="$(git shortlog -sn --since="last Monday" HEAD -- \
            'backend/tests/*' 'frontend/tests/*' 'e2e/*' 'fitloyalty_cliente/test/*' '*.test.*' '*.spec.*')"
          {
            echo "### Commits de pruebas por autor desde el lunes"
            echo
            echo '```'
            echo "${autores:-Sin commits de pruebas desde el lunes.}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
